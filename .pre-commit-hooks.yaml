- id: rusty-todo-md
  name: Rusty TODO Extractor
  entry: rusty-todo-md
  language: python
  types: [text]
  # Every invocation does read-merge-write on TODO.md. Without this,
  # pre-commit splits the file list into parallel batches and the
  # concurrent writers drop each other's entries.
  require_serial: true
  # When .gitattributes routes TODO.md to the merge driver, every run
  # registers the driver for this clone. The pre-rebase stage does that
  # before a rebase (it gets no files and never touches TODO.md), and
  # always_run makes that zero-file run happen at all.
  stages: [pre-commit, pre-rebase]
  always_run: true
