- id: rusty-todo-md
  name: Rusty TODO Extractor
  entry: rusty-todo-md
  language: python
  types: [text]
  # Every invocation does read-merge-write on TODO.md. Without this,
  # pre-commit splits the file list into parallel batches and the
  # concurrent writers drop each other's entries.
  require_serial: true

# Optional. Aborts a rebase when .gitattributes routes TODO.md to the
# merge driver but this clone hasn't registered it (or its binary is
# gone), since git would silently fall back to its text merge. Read-only;
# the rusty-todo-md hook above does the registering. Needs the pre-rebase
# hook type installed (default_install_hook_types: [pre-commit, pre-rebase]).
- id: rusty-todo-md-pre-rebase
  name: Rusty TODO merge driver check
  entry: rusty-todo-md --check-merge-driver
  language: python
  stages: [pre-rebase]
  always_run: true
  pass_filenames: false
  minimum_pre_commit_version: "3.2.0"
